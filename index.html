<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nomio | Find a name. Start a project.</title>
  <meta name="description" content="Discover domain names and generate GitHub-ready project starters." />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Nomio | Find a name. Start a project." />
  <meta property="og:description" content="Discover domain names and generate GitHub-ready project starters." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='black'/%3E%3Cpath d='M6 6 L6 26 L11 26 L11 14.5 L21 26 L26 26 L26 6 L21 6 L21 17.5 L11 6 Z' fill='white'/%3E%3C/svg%3E" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>

  <style>
    /* ====================== Reset ====================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ====================== Tokens ====================== */
    :root {
      --black:    #000;
      --white:    #fff;
      --g100:     #f5f5f5;
      --g200:     #e8e8e8;
      --g400:     #999;
      --g600:     #555;
      --g800:     #222;
      --radius:   6px;
      --font:     'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-display: 'Syne', system-ui, -apple-system, sans-serif;
      --font-mono:    'JetBrains Mono', 'SF Mono', monospace;
    }

    /* ====================== Base ====================== */
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--white);
      color: var(--black);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
    p { color: var(--g600); }
    button { font-family: var(--font); cursor: pointer; }

    /* ====================== Layout ====================== */
    .container { max-width: 960px; margin: 0 auto; padding: 0 24px; }

    /* ====================== Header ====================== */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--white);
      border-bottom: 1px solid var(--g200);
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      height: 56px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--black);
    }
    .logo-mark { width: 30px; height: 30px; flex-shrink: 0; }
    .logo-text {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 800; letter-spacing: -0.05em;
    }
    .nav-about {
      background: none; border: none;
      font-family: var(--font);
      font-size: 14px; font-weight: 500; color: var(--g600);
      padding: 6px 0; transition: color .15s;
    }
    .nav-about:hover { color: var(--black); }

    /* ====================== Hero ====================== */
    .hero { padding: 88px 0 68px; border-bottom: 1px solid var(--g200); }
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(42px, 6.5vw, 76px);
      font-weight: 800; letter-spacing: -0.04em;
      margin-bottom: 18px;
    }
    .hero p  { font-size: 16px; line-height: 1.65; margin-bottom: 44px; max-width: 400px; }

    /* ====================== Search ====================== */
    .search-block { display: flex; flex-direction: column; gap: 14px; }
    .input-row { display: flex; gap: 10px; }
    .keyword-input {
      flex: 1; height: 48px;
      border: 1.5px solid var(--g200); border-radius: var(--radius);
      font-size: 15px; padding: 0 16px; outline: none;
      transition: border-color .15s;
    }
    .keyword-input:focus { border-color: var(--black); }
    .keyword-input::placeholder { color: var(--g400); }

    /* Primary button */
    .btn-primary {
      height: 48px; padding: 0 24px;
      background: var(--black); color: var(--white);
      border: none; border-radius: var(--radius);
      font-size: 14px; font-weight: 600; white-space: nowrap;
      letter-spacing: -.01em; transition: opacity .15s;
    }
    .btn-primary:hover   { opacity: .82; }
    .btn-primary:active  { opacity: .68; }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }

    /* Secondary button */
    .btn-secondary {
      height: 38px; padding: 0 16px;
      background: var(--white); color: var(--black);
      border: 1.5px solid var(--g200); border-radius: var(--radius);
      font-size: 13px; font-weight: 500;
      transition: border-color .15s;
    }
    .btn-secondary:hover { border-color: var(--black); }

    /* ====================== Chips ====================== */
    .categories { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      height: 34px; padding: 0 14px;
      display: inline-flex; align-items: center;
      border: 1.5px solid var(--g200); border-radius: 100px;
      font-size: 13px; font-weight: 500; color: var(--g600);
      background: var(--white); transition: all .15s; user-select: none;
    }
    .chip:hover { border-color: var(--black); color: var(--black); }
    .chip.active { background: var(--black); color: var(--white); border-color: var(--black); }

    /* ====================== Results ====================== */
    .results-section { padding: 56px 0; display: none; }
    .results-section.visible { display: block; }

    .results-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .results-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -.03em; }
    .results-meta { font-size: 13px; color: var(--g400); }

    /* TLD filters */
    .tld-filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .tld-btn {
      height: 30px; padding: 0 12px;
      border: 1.5px solid var(--g200); border-radius: 100px;
      font-size: 12px; font-weight: 600; color: var(--g600);
      background: var(--white); transition: all .15s; letter-spacing: .02em;
    }
    .tld-btn:hover { border-color: var(--black); color: var(--black); }
    .tld-btn.active { background: var(--black); color: var(--white); border-color: var(--black); }

    /* ====================== Domain grid ====================== */
    .domain-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
      gap: 12px;
    }

    /* ====================== Domain card ====================== */
    .domain-card {
      border: 1.5px solid var(--g200); border-radius: var(--radius);
      padding: 18px 18px 14px;
      display: flex; flex-direction: column; gap: 12px;
      transition: border-color .15s, box-shadow .15s;
    }
    .domain-card:hover { border-color: #bbb; box-shadow: 0 2px 12px rgba(0,0,0,.06); }

    .card-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    }
    .domain-name {
      font-family: var(--font-display);
      font-size: 17px; font-weight: 700; letter-spacing: -.04em; word-break: break-all;
    }
    .domain-tld { color: var(--g400); font-weight: 400; }

    .status-badge {
      font-size: 10px; font-weight: 700; padding: 3px 8px;
      border-radius: 100px; white-space: nowrap; flex-shrink: 0;
      letter-spacing: .04em; text-transform: uppercase;
    }
    .status-available { background: #edfbee; color: #1a7a1a; }
    .status-taken     { background: var(--g100); color: var(--g400); }
    .status-premium   { background: #fff9ec; color: #8a6000; }

    .card-actions { display: flex; gap: 8px; }

    .btn-save {
      height: 32px; padding: 0 12px;
      border: 1.5px solid var(--g200); border-radius: var(--radius);
      font-size: 12px; font-weight: 500; color: var(--g600);
      background: var(--white); transition: all .15s;
    }
    .btn-save:hover { border-color: var(--black); color: var(--black); }
    .btn-save.saved { border-color: var(--black); color: var(--black); font-weight: 700; background: var(--g100); }

    .btn-starter {
      height: 32px; padding: 0 12px;
      border: none; border-radius: var(--radius);
      font-size: 12px; font-weight: 600; color: var(--white);
      background: var(--black); transition: opacity .15s;
    }
    .btn-starter:hover { opacity: .78; }

    /* ====================== Saved section ====================== */
    .saved-section { padding: 40px 0 0; display: none; }
    .saved-section.visible { display: block; }
    .section-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--g400); margin-bottom: 14px;
    }

    /* ====================== Loading ====================== */
    .generating {
      grid-column: 1 / -1;
      text-align: center; padding: 60px 0;
      font-size: 14px; color: var(--g400);
    }
    .dot-pulse::after {
      content: '';
      animation: dots 1.4s infinite;
    }
    @keyframes dots {
      0%   { content: '.'; }
      33%  { content: '..'; }
      66%  { content: '...'; }
    }

    /* ====================== Empty ====================== */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center; padding: 60px 0;
      font-size: 14px; color: var(--g400);
    }

    /* ====================== Modal ====================== */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.48);
      display: none; align-items: center; justify-content: center;
      padding: 24px;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--white); border-radius: 12px;
      width: 100%; max-width: 580px;
      max-height: 92vh; overflow-y: auto;
      position: relative;
    }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 28px 0;
      position: sticky; top: 0; background: var(--white);
      z-index: 1; padding-bottom: 0;
    }
    .modal-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: -.04em; }
    .modal-close {
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border: none; background: var(--g100); border-radius: 50%;
      font-size: 14px; color: var(--g600);
      transition: background .15s; flex-shrink: 0;
    }
    .modal-close:hover { background: var(--g200); color: var(--black); }

    .modal-body { padding: 20px 28px 32px; }

    /* ====================== Starter modal internals ====================== */
    .starter-row { margin-bottom: 20px; }
    .field-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--g400); margin-bottom: 5px;
    }
    .field-value { font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: -.03em; }

    .template-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
      margin-bottom: 24px;
    }
    .tpl-opt {
      border: 1.5px solid var(--g200); border-radius: var(--radius);
      padding: 12px 14px; cursor: pointer; transition: all .15s; user-select: none;
    }
    .tpl-opt:hover { border-color: var(--g800); }
    .tpl-opt.selected { border-color: var(--black); background: var(--g100); }
    .tpl-opt:focus-visible { outline: 2px solid var(--black); outline-offset: 2px; }
    .tpl-name { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: -.02em; }
    .tpl-desc { font-size: 11px; color: var(--g400); margin-top: 2px; }

    /* File list */
    .file-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
    .file-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: var(--g100); border-radius: var(--radius);
    }
    .file-name { font-size: 12px; font-weight: 500; font-family: var(--font-mono); }
    .file-size { font-size: 11px; color: var(--g400); }

    hr.divider { border: none; border-top: 1px solid var(--g200); margin: 24px 0; }

    /* Export actions */
    .export-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }

    /* GitHub section */
    .gh-title { font-family: var(--font-display); font-size: 14px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 16px; }
    .gh-field { margin-bottom: 12px; }
    .gh-value { font-size: 13px; color: var(--g800); }

    .code-block {
      background: var(--g100); border-radius: var(--radius);
      padding: 14px 16px; font-family: var(--font-mono);
      font-size: 11.5px; line-height: 1.8; color: var(--g800);
      white-space: pre; overflow-x: auto; margin-bottom: 10px;
    }

    .btn-copy {
      height: 36px; padding: 0 16px;
      border: 1.5px solid var(--g200); border-radius: var(--radius);
      font-size: 12px; font-weight: 600; color: var(--g600);
      background: var(--white); transition: all .15s;
    }
    .btn-copy:hover { border-color: var(--black); color: var(--black); }
    .btn-copy.copied { border-color: #1a7a1a; color: #1a7a1a; }

    /* ====================== About modal ====================== */
    .about-body { padding: 24px 28px 32px; }
    .about-body p { font-size: 16px; line-height: 1.7; color: var(--g600); }
    .about-body p + p { margin-top: 14px; }

    /* ====================== Footer ====================== */
    footer { border-top: 1px solid var(--g200); padding: 32px 0; margin-top: 80px; }
    .footer-inner {
      display: flex; align-items: center; justify-content: space-between;
    }
    .footer-brand { font-family: var(--font-display); font-size: 15px; font-weight: 800; letter-spacing: -.05em; }
    .footer-tag   { font-size: 13px; color: var(--g400); }

    /* ====================== Animations ====================== */
    .fade-in { animation: fadeUp .22s ease both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ====================== Toast ====================== */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--black); color: var(--white);
      font-size: 13px; font-weight: 500; padding: 10px 20px;
      border-radius: 100px; z-index: 999;
      opacity: 0; transition: opacity .2s;
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* ====================== Mobile ====================== */
    @media (max-width: 600px) {
      .hero { padding: 48px 0 40px; }
      .input-row { flex-direction: column; }
      .btn-primary { height: 44px; }
      .domain-grid { grid-template-columns: 1fr; }
      .template-grid { grid-template-columns: 1fr; }
      .results-header { flex-direction: column; align-items: flex-start; }
      .footer-inner { flex-direction: column; align-items: flex-start; gap: 4px; }
      .modal { border-radius: 10px; }
      .modal-header { padding: 20px 20px 0; }
      .modal-body { padding: 16px 20px 28px; }
      .about-body { padding: 20px 20px 28px; }
    }
  </style>
</head>
<body>

<!-- ============================== Header ============================== -->
<header>
  <div class="container">
    <div class="header-inner">
      <a href="/" class="logo" aria-label="Nomio">
        <svg class="logo-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="32" height="32" fill="#000"/>
          <path d="M6 6L6 26L11 26L11 14.5L21 26L26 26L26 6L21 6L21 17.5L11 6Z" fill="#fff"/>
        </svg>
        <span class="logo-text">Nomio</span>
      </a>
      <button class="nav-about" id="openAbout">About</button>
    </div>
  </div>
</header>

<!-- ============================== Main ============================== -->
<main>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <h1>Find a name.<br>Start a project.</h1>
      <p>Discover brandable domains and generate project starters in minutes.</p>

      <div class="search-block">
        <div class="input-row">
          <input
            type="text"
            class="keyword-input"
            id="keywordInput"
            placeholder="video, finance, agent, studio..."
            maxlength="64"
            autocomplete="off"
            spellcheck="false"
            aria-label="Keyword"
          />
          <button class="btn-primary" id="generateBtn">Generate Domains</button>
        </div>

        <div class="categories" id="chips" role="group" aria-label="Categories">
          <button class="chip" data-cat="AI">AI</button>
          <button class="chip" data-cat="SaaS">SaaS</button>
          <button class="chip" data-cat="Developer Tools">Developer Tools</button>
          <button class="chip" data-cat="Media">Media</button>
          <button class="chip" data-cat="Finance">Finance</button>
          <button class="chip" data-cat="Healthcare">Healthcare</button>
          <button class="chip" data-cat="Crypto">Crypto</button>
          <button class="chip" data-cat="Ecommerce">Ecommerce</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Saved domains -->
  <section class="saved-section" id="savedSection" aria-label="Saved domains">
    <div class="container">
      <p class="section-label" id="savedLabel">Saved</p>
      <div class="domain-grid" id="savedGrid"></div>
    </div>
  </section>

  <!-- Results -->
  <section class="results-section" id="resultsSection" aria-label="Domain results">
    <div class="container">
      <div class="results-header">
        <div>
          <p class="results-title" id="resultsTitle">Results</p>
          <p class="results-meta" id="resultsMeta"></p>
        </div>
        <div class="tld-filters" id="tldFilters" role="group" aria-label="Filter by TLD">
          <button class="tld-btn active" data-tld="all">All</button>
          <button class="tld-btn" data-tld=".com">.com</button>
          <button class="tld-btn" data-tld=".io">.io</button>
          <button class="tld-btn" data-tld=".ai">.ai</button>
          <button class="tld-btn" data-tld=".app">.app</button>
          <button class="tld-btn" data-tld=".fun">.fun</button>
        </div>
      </div>
      <div class="domain-grid" id="domainGrid"></div>
    </div>
  </section>

</main>

<!-- ============================== Footer ============================== -->
<footer>
  <div class="container">
    <div class="footer-inner">
      <span class="footer-brand">Nomio</span>
      <span class="footer-tag">Built for builders.</span>
    </div>
  </div>
</footer>

<!-- ============================== Starter Modal ============================== -->
<div class="modal-overlay" id="starterModal" role="dialog" aria-modal="true" aria-labelledby="starterTitle">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="starterTitle">Generate Starter</span>
      <button class="modal-close" id="closeStarter" aria-label="Close">&#x2715;</button>
    </div>
    <div class="modal-body" id="starterBody"></div>
  </div>
</div>

<!-- ============================== About Modal ============================== -->
<div class="modal-overlay" id="aboutModal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="aboutTitle">About</span>
      <button class="modal-close" id="closeAbout" aria-label="Close">&#x2715;</button>
    </div>
    <div class="about-body">
      <p>Nomio helps builders move from idea to execution.</p>
      <p>Discover domain names, create a starter kit, and launch faster.</p>
    </div>
  </div>
</div>

<!-- ============================== Toast ============================== -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ============================== Script ============================== -->
<script>
/* ========================================================
   Constants
======================================================== */
const TLDS = ['.com','.io','.ai','.app','.fun'];

const PREFIXES = [
  'nova','flux','neo','arc','core','base','hub','kit','lab','net',
  'next','open','pro','rapid','smart','super','ultra','uni','zero','go',
  'my','get','use','try','run','on','re','up','do','be'
];

const SUFFIXES = [
  'ly','ify','iq','io','ai','hq','kit','lab','hub','app',
  'base','flow','stack','desk','pro','ora','aro','ex','ive','ix',
  'ium','ery','fy','zy','sy','co','io','oo','ro','vo'
];

const BLENDS = [
  'ora','ova','era','ara','ila','ela','uri','ini','ani','eno',
  'omo','ato','eto','ito','uto','ario','ario','orio','orio','urio'
];

const TEMPLATES = [
  { id:'landing',  name:'Landing Page',    desc:'Single page marketing site' },
  { id:'saas',     name:'SaaS',            desc:'Dashboard + auth scaffold'  },
  { id:'directory',name:'Directory',       desc:'Listing and search app'     },
  { id:'ai-tool',  name:'AI Tool',         desc:'AI-powered utility app'     },
  { id:'chrome',   name:'Chrome Extension',desc:'Browser extension starter'  }
];

const TLD_WEIGHTS = [
  ['.com',4],['.io',3],['.ai',3],['.app',2],['.fun',1]
];

/* ========================================================
   State
======================================================== */
let allDomains     = [];
let savedIds       = new Set();
let activeTld      = 'all';
let activeCategory = null;
let currentDomain  = null;
let selectedTpl    = TEMPLATES[0];

/* ========================================================
   Utilities
======================================================== */
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); }

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]/g,''); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ========================================================
   Domain generation
======================================================== */
function makeName(kw){
  const k = kw.length>6 ? kw.slice(0,6) : kw;
  const p = Math.floor(Math.random()*6);
  switch(p){
    case 0: return cap(k) + rand(SUFFIXES);
    case 1: return cap(rand(PREFIXES)) + cap(k);
    case 2: return cap(k.slice(0,4)) + rand(BLENDS);
    case 3: return cap(rand(PREFIXES)) + rand(BLENDS);
    case 4: return cap(k) + 'hq';
    case 5: return cap(k.slice(0,3)) + cap(rand(PREFIXES));
    default: return cap(k) + rand(SUFFIXES);
  }
}

function pickTld(){
  const pool = [];
  TLD_WEIGHTS.forEach(([t,w])=>{ for(let i=0;i<w;i++) pool.push(t); });
  return rand(pool);
}

function getStatus(){
  const r = Math.random();
  if(r < 0.35) return 'available';
  if(r < 0.82) return 'taken';
  return 'premium';
}

function generateDomains(keyword){
  const kw  = slug(keyword) || 'build';
  const seen = new Set();
  const out  = [];
  let tries  = 0;
  while(out.length < 60 && tries < 400){
    tries++;
    const name = makeName(kw);
    const tld  = pickTld();
    const full = name.toLowerCase()+tld;
    if(seen.has(full) || name.length<3 || name.length>13) continue;
    seen.add(full);
    out.push({ id:full, name, tld, full, status:getStatus() });
  }
  return out;
}

/* ========================================================
   Render card
======================================================== */
function renderCard(domain, container){
  const isSaved = savedIds.has(domain.id);
  const card    = document.createElement('div');
  card.className = 'domain-card fade-in';
  card.dataset.id = domain.id;

  card.innerHTML = `
    <div class="card-top">
      <span class="domain-name">${domain.name}<span class="domain-tld">${domain.tld}</span></span>
      <span class="status-badge status-${domain.status}">${cap(domain.status)}</span>
    </div>
    <div class="card-actions">
      <button class="btn-save${isSaved?' saved':''}" data-id="${domain.id}">
        ${isSaved ? 'Saved' : 'Save'}
      </button>
      <button class="btn-starter" data-id="${domain.id}">Generate Starter</button>
    </div>`;

  card.querySelector('.btn-save').addEventListener('click',()=> toggleSave(domain));
  card.querySelector('.btn-starter').addEventListener('click',()=> openStarter(domain));
  container.appendChild(card);
}

function renderGrid(list){
  const grid = document.getElementById('domainGrid');
  grid.innerHTML = '';
  if(!list.length){
    grid.innerHTML = '<div class="empty-state">No domains match this filter.</div>';
    return;
  }
  list.forEach(d => renderCard(d, grid));
  updateMeta(list);
}

function updateMeta(list){
  const avail = list.filter(d=>d.status==='available').length;
  document.getElementById('resultsMeta').textContent =
    `${list.length} names${avail ? `, ${avail} available` : ''}`;
}

/* ========================================================
   Save
======================================================== */
function toggleSave(domain){
  if(savedIds.has(domain.id)){
    savedIds.delete(domain.id);
    showToast('Removed from saved');
  } else {
    savedIds.add(domain.id);
    showToast('Saved');
  }
  // Update all matching buttons
  document.querySelectorAll(`.btn-save[data-id="${domain.id}"]`).forEach(btn=>{
    const on = savedIds.has(domain.id);
    btn.textContent = on ? 'Saved' : 'Save';
    btn.classList.toggle('saved', on);
  });
  renderSaved();
}

function renderSaved(){
  const sec    = document.getElementById('savedSection');
  const lbl    = document.getElementById('savedLabel');
  const grid   = document.getElementById('savedGrid');
  const saved  = allDomains.filter(d=> savedIds.has(d.id));

  if(!saved.length){ sec.classList.remove('visible'); return; }

  sec.classList.add('visible');
  lbl.textContent = `Saved (${saved.length})`;
  grid.innerHTML  = '';
  saved.forEach(d=> renderCard(d, grid));
}

/* ========================================================
   Generate flow
======================================================== */
function generate(){
  const raw = document.getElementById('keywordInput').value.trim();
  const kw  = raw || 'build';
  const btn = document.getElementById('generateBtn');

  const sec = document.getElementById('resultsSection');
  sec.classList.add('visible');
  document.getElementById('domainGrid').innerHTML =
    `<div class="generating"><span class="dot-pulse">Generating domains</span></div>`;
  document.getElementById('resultsTitle').textContent = `Results for "${kw}"`;
  document.getElementById('resultsMeta').textContent  = '';
  btn.disabled = true;

  setTimeout(()=>{
    allDomains = generateDomains(kw);
    activeTld  = 'all';
    document.querySelectorAll('.tld-btn').forEach(b=>
      b.classList.toggle('active', b.dataset.tld==='all'));
    renderGrid(allDomains);
    btn.disabled = false;
    sec.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 700);
}

/* ========================================================
   Starter files
======================================================== */
function tagline(name, tpl){
  const map = {
    landing:   `The home for ${name}.`,
    saas:      `${name} makes your workflow faster.`,
    directory: `Find everything on ${name}.`,
    'ai-tool': `${name} puts AI to work.`,
    chrome:    `${name} lives in your browser.`
  };
  return map[tpl.id] || `${name}. Built for what comes next.`;
}

function fileReadme(domain, tpl, tag){
  return `# ${domain.name}\n\n${tag}\n\nGenerated by Nomio.\n`;
}

function fileIndex(domain, tpl, tag){
  return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${domain.name}</title>
  <meta name="description" content="${tag}" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #fff; color: #000;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .wrap { text-align: center; max-width: 480px; }
    h1 { font-size: clamp(36px,8vw,64px); font-weight: 700; letter-spacing: -.04em; margin-bottom: 12px; }
    p  { color: #666; font-size: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>${domain.name}</h1>
    <p>${tag}</p>
  </div>
</body>
</html>`;
}

function fileFavicon(domain){
  const L = domain.name.charAt(0).toUpperCase();
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#000"/>
  <text x="16" y="23" font-family="system-ui" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">${L}</text>
</svg>`;
}

function fileLogo(domain){
  const L = domain.name.charAt(0).toUpperCase();
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#000"/>
  <text x="32" y="46" font-family="system-ui" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">${L}</text>
</svg>`;
}

function fileBrand(domain, tpl, tag){
  return JSON.stringify({
    name: domain.name,
    domain: domain.full,
    tagline: tag,
    template: tpl.id,
    generated: new Date().toISOString().slice(0,10)
  }, null, 2);
}

function gitCmds(domain){
  return `git init
git add .
git commit -m "Initial commit"
git branch -M main
git remote add origin https://github.com/YOUR_USERNAME/${domain.name.toLowerCase()}
git push -u origin main`;
}

/* ========================================================
   Starter modal
======================================================== */
function openStarter(domain){
  currentDomain   = domain;
  selectedTpl     = TEMPLATES[0];
  renderStarter();
  document.getElementById('starterModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderStarter(){
  const domain = currentDomain;
  const tpl    = selectedTpl;
  const tag    = tagline(domain.name, tpl);

  const readme  = fileReadme(domain, tpl, tag);
  const idx     = fileIndex(domain, tpl, tag);
  const fav     = fileFavicon(domain);
  const logo    = fileLogo(domain);
  const brand   = fileBrand(domain, tpl, tag);
  const cmds    = gitCmds(domain);

  const files = [
    { name:'README.md',   content:readme, mime:'text/markdown'     },
    { name:'index.html',  content:idx,    mime:'text/html'         },
    { name:'favicon.svg', content:fav,    mime:'image/svg+xml'     },
    { name:'logo.svg',    content:logo,   mime:'image/svg+xml'     },
    { name:'brand.json',  content:brand,  mime:'application/json'  }
  ];

  const body = document.getElementById('starterBody');
  body.innerHTML = `
    <div class="starter-row">
      <p class="field-label">Domain</p>
      <p class="field-value">${domain.full}</p>
    </div>
    <div class="starter-row">
      <p class="field-label">Brand Name</p>
      <p class="field-value">${domain.name}</p>
    </div>
    <div class="starter-row">
      <p class="field-label">Tagline</p>
      <p class="field-value" id="taglineVal">${tag}</p>
    </div>

    <p class="field-label" style="margin-bottom:8px">Template</p>
    <div class="template-grid" id="tplGrid">
      ${TEMPLATES.map(t=>`
        <div class="tpl-opt${t.id===tpl.id?' selected':''}" data-tid="${t.id}" role="button" tabindex="0">
          <p class="tpl-name">${t.name}</p>
          <p class="tpl-desc">${t.desc}</p>
        </div>`).join('')}
    </div>

    <p class="field-label" style="margin-bottom:8px">Generated Files</p>
    <div class="file-list">
      ${files.map(f=>`
        <div class="file-item">
          <span class="file-name">${f.name}</span>
          <span class="file-size">${f.content.length}B</span>
        </div>`).join('')}
    </div>

    <hr class="divider" />

    <div class="export-row">
      <button class="btn-secondary" id="dlReadme">Download README</button>
      <button class="btn-secondary" id="dlJson">Download brand.json</button>
      <button class="btn-secondary" id="dlZip">Download ZIP</button>
    </div>

    <hr class="divider" />

    <p class="gh-title">GitHub Export</p>

    <div class="gh-field">
      <p class="field-label">Repository Name</p>
      <p class="gh-value">${domain.name.toLowerCase()}</p>
    </div>
    <div class="gh-field">
      <p class="field-label">Suggested Description</p>
      <p class="gh-value">${tag}</p>
    </div>

    <p class="field-label" style="margin-bottom:6px">Push Instructions</p>
    <div class="code-block" id="gitBlock">${cmds}</div>
    <button class="btn-copy" id="copyGit">Copy Commands</button>
  `;

  /* --- Template selection --- */
  body.querySelectorAll('.tpl-opt').forEach(opt=>{
    const select = ()=>{
      selectedTpl = TEMPLATES.find(t=> t.id===opt.dataset.tid);
      renderStarter();
    };
    opt.addEventListener('click', select);
    opt.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); select(); } });
  });

  /* --- Downloads --- */
  body.querySelector('#dlReadme').addEventListener('click',()=> dlFile('README.md', readme, 'text/markdown'));
  body.querySelector('#dlJson').addEventListener('click',()=> dlFile('brand.json', brand, 'application/json'));
  body.querySelector('#dlZip').addEventListener('click',()=> dlZip(domain, files));

  /* --- Copy git --- */
  body.querySelector('#copyGit').addEventListener('click',()=> copyText(cmds, body.querySelector('#copyGit')));
}

/* ========================================================
   File download helpers
======================================================== */
function dlFile(name, content, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type:mime}));
  a.download = name;
  a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 1000);
  showToast(`Downloading ${name}`);
}

async function dlZip(domain, files){
  const btn = document.getElementById('dlZip');
  btn.textContent = 'Creating ZIP...';
  btn.disabled    = true;

  try {
    if(typeof JSZip === 'undefined') throw new Error('JSZip not loaded');
    const zip = new JSZip();
    files.forEach(f=> zip.file(f.name, f.content));
    const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE' });
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = `${domain.name.toLowerCase()}-starter.zip`;
    a.click();
    setTimeout(()=> URL.revokeObjectURL(a.href), 1000);
    showToast('ZIP downloaded');
  } catch(err){
    /* Fallback: bundle as plain text */
    const txt = files.map(f=>`=== ${f.name} ===\n${f.content}`).join('\n\n');
    dlFile(`${domain.name.toLowerCase()}-starter.txt`, txt, 'text/plain');
  } finally {
    btn.textContent = 'Download ZIP';
    btn.disabled    = false;
  }
}

/* ========================================================
   Copy to clipboard
======================================================== */
async function copyText(text, btn){
  const orig = btn.textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = Object.assign(document.createElement('textarea'),{
      value:text, style:'position:fixed;opacity:0'
    });
    document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
  }
  btn.textContent = 'Copied!';
  btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent=orig; btn.classList.remove('copied'); }, 1800);
}

/* ========================================================
   Modal helpers
======================================================== */
function closeStarter(){
  document.getElementById('starterModal').classList.remove('open');
  document.body.style.overflow = '';
}
function closeAbout(){
  document.getElementById('aboutModal').classList.remove('open');
  document.body.style.overflow = '';
}

/* ========================================================
   Event wiring
======================================================== */
document.getElementById('generateBtn').addEventListener('click', generate);
document.getElementById('keywordInput').addEventListener('keydown', e=>{ if(e.key==='Enter') generate(); });

/* Category chips */
document.getElementById('chips').addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  if(activeCategory===chip.dataset.cat){
    activeCategory = null;
    chip.classList.remove('active');
  } else {
    document.querySelectorAll('.chip').forEach(c=> c.classList.remove('active'));
    chip.classList.add('active');
    activeCategory = chip.dataset.cat;
  }
  /* Clicking a category auto-fills the input if empty */
  const inp = document.getElementById('keywordInput');
  if(!inp.value.trim()) inp.value = chip.dataset.cat.toLowerCase().split(' ')[0];
});

/* TLD filters */
document.getElementById('tldFilters').addEventListener('click', e=>{
  const btn = e.target.closest('.tld-btn');
  if(!btn) return;
  activeTld = btn.dataset.tld;
  document.querySelectorAll('.tld-btn').forEach(b=> b.classList.toggle('active', b===btn));
  renderGrid(activeTld==='all' ? allDomains : allDomains.filter(d=> d.tld===activeTld));
});

/* Starter modal */
document.getElementById('closeStarter').addEventListener('click', closeStarter);
document.getElementById('starterModal').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeStarter(); });

/* About modal */
document.getElementById('openAbout').addEventListener('click',()=>{
  document.getElementById('aboutModal').classList.add('open');
  document.body.style.overflow = 'hidden';
});
document.getElementById('closeAbout').addEventListener('click', closeAbout);
document.getElementById('aboutModal').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeAbout(); });

/* Escape key */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeStarter(); closeAbout(); }
});
</script>
